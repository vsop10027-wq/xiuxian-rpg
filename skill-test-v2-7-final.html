<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>天命・破界 V2.7 最終版</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050714;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;text-align:center}
#title{position:absolute;top:5vh;width:100%;font-size:clamp(20px,5vw,36px);letter-spacing:.22em;text-shadow:0 0 12px #fff,0 0 30px #7ad}
#sub{position:absolute;top:11vh;width:100%;font-size:12px;opacity:.7;letter-spacing:.15em}
#hint{position:absolute;bottom:4vh;width:100%;font-size:12px;opacity:.55}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div id="title">天命・破界</div><div id="sub">V2.7 · FINAL IMPACT TEST</div><div id="hint">點擊畫面重新施放</div></div>
<script>
'use strict';
const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false});
let W=0,H=0,D=1,t=0,last=0,running=true,shake=0,flash=0,hitStop=0;
let bossHP=1,bossRecoil=0,burst=[];
function resize(){
  D=Math.min(devicePixelRatio||1,1.5); W=innerWidth; H=innerHeight;
  c.width=Math.floor(W*D); c.height=Math.floor(H*D); x.setTransform(D,0,0,D,0,0);
}
addEventListener('resize',resize,{passive:true}); resize();

const TAU=Math.PI*2;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function ease(v){return v<.5?2*v*v:1-Math.pow(-2*v+2,2)/2}
function rr(a,b){return a+Math.random()*(b-a)}

function line(a,b,col,w=1){
  x.strokeStyle=col;x.lineWidth=w;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();
}
function circle(px,py,r,col,alpha=1){
  x.globalAlpha=alpha;x.strokeStyle=col;x.lineWidth=1.5;x.beginPath();x.arc(px,py,r,0,TAU);x.stroke();x.globalAlpha=1;
}
function glowCircle(px,py,r,col,alpha=1){
  x.save();x.globalAlpha=alpha;x.shadowBlur=18;x.shadowColor=col;x.strokeStyle=col;x.lineWidth=2;
  x.beginPath();x.arc(px,py,r,0,TAU);x.stroke();x.restore();
}
function drawTaiji(px,py,r){
  x.save();x.translate(px,py);x.rotate(-t*.22);
  x.globalAlpha=.78;x.lineWidth=2;
  x.strokeStyle='rgba(205,230,255,.8)';x.beginPath();x.arc(0,0,r,0,TAU);x.stroke();
  x.beginPath();x.arc(0,0,r*.68,0,TAU);x.stroke();
  x.strokeStyle='rgba(255,255,255,.34)';
  x.beginPath();x.arc(0,0,r*.46,0,Math.PI);x.stroke();
  x.beginPath();x.arc(0,0,r*.46,Math.PI,TAU);x.stroke();
  x.fillStyle='rgba(235,245,255,.7)';x.beginPath();x.arc(0,-r*.25,r*.055,0,TAU);x.fill();
  x.fillStyle='rgba(20,30,60,.9)';x.beginPath();x.arc(0,r*.25,r*.055,0,TAU);x.fill();
  x.restore();
}
function drawBagua(px,py,r){
  x.save();x.translate(px,py);x.rotate(t*.1);x.globalAlpha=.55;x.strokeStyle='#bcdcff';x.lineWidth=1.3;
  x.beginPath();x.arc(0,0,r,0,TAU);x.stroke();
  for(let i=0;i<8;i++){
    let a=i*TAU/8, cx=Math.cos(a)*r*.78, cy=Math.sin(a)*r*.78;
    x.save();x.translate(cx,cy);x.rotate(a);
    for(let k=-1;k<=1;k++){
      x.beginPath();x.moveTo(-10,k*5);x.lineTo(-2,k*5);x.stroke();
      if((i+k+3)%2===0){x.beginPath();x.moveTo(2,k*5);x.lineTo(10,k*5);x.stroke()}
      else{x.beginPath();x.moveTo(2,k*5);x.lineTo(10,k*5);x.stroke()}
    } x.restore();
  }
  x.restore();
}
function sword(px,py,a,len,alpha=1){
  x.save();x.translate(px,py);x.rotate(a);x.globalAlpha=alpha;
  x.shadowBlur=10;x.shadowColor='#dff4ff';x.fillStyle='#dff4ff';
  x.beginPath();x.moveTo(0,-len);x.lineTo(3,-len*.72);x.lineTo(2,10);x.lineTo(-2,10);x.lineTo(-3,-len*.72);x.closePath();x.fill();
  x.fillStyle='#e9c77b';x.fillRect(-5,9,10,3);x.fillRect(-2,12,4,12);
  x.restore();
}
function drawBoss(){
  let bx=W*.5, by=H*.27+bossRecoil;
  x.save();x.translate(bx,by);
  x.globalAlpha=.96;x.shadowBlur=22;x.shadowColor='rgba(160,70,255,.8)';
  x.fillStyle='rgba(18,10,40,.96)';
  x.beginPath();x.arc(0,0,52,0,TAU);x.fill();
  x.strokeStyle='rgba(220,170,255,.9)';x.lineWidth=2;x.stroke();
  x.fillStyle='#eee';x.shadowBlur=8;x.shadowColor='#f6d8ff';
  x.beginPath();x.arc(-17,-6,4,0,TAU);x.arc(17,-6,4,0,TAU);x.fill();
  x.strokeStyle='rgba(255,255,255,.65)';x.beginPath();x.moveTo(-18,20);x.quadraticCurveTo(0,28,18,20);x.stroke();
  x.restore();
}
function drawHero(){
  let hx=W*.5,hy=H*.83;
  x.save();x.translate(hx,hy);
  x.shadowBlur=18;x.shadowColor='#8fdcff';x.fillStyle='rgba(100,180,255,.9)';
  x.beginPath();x.arc(0,-32,14,0,TAU);x.fill();
  x.fillStyle='rgba(40,80,150,.9)';x.beginPath();x.moveTo(-20,-16);x.lineTo(20,-16);x.lineTo(29,38);x.lineTo(-29,38);x.closePath();x.fill();
  x.strokeStyle='#e8f8ff';x.lineWidth=3;x.beginPath();x.moveTo(20,4);x.lineTo(62,-55);x.stroke();
  x.restore();
}
function background(){
  let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#080c22');g.addColorStop(.55,'#10183a');g.addColorStop(1,'#040611');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.globalAlpha=.2;x.fillStyle='#a8cfff';
  for(let i=0;i<18;i++){let px=(i*137+t*3)%W,py=H*.18+((i*83)%H*.35);x.beginPath();x.arc(px,py,1.2,0,TAU);x.fill()}
  x.globalAlpha=1;
  x.fillStyle='rgba(30,45,80,.45)';
  x.beginPath();x.moveTo(0,H*.65);for(let i=0;i<=10;i++)x.lineTo(i*W/10,H*(.57+((i%3)*.035)));x.lineTo(W,H);x.lineTo(0,H);x.fill();
}
function emitImpact(px,py){
  burst=[];
  for(let i=0;i<26;i++){
    let a=rr(0,TAU),sp=rr(2,7);
    burst.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rr(.28,.55)});
  }
}
function drawBurst(dt){
  for(let p of burst){p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;p.life-=dt;
    if(p.life>0){x.globalAlpha=clamp(p.life*2,0,1);x.fillStyle='#dff7ff';x.fillRect(p.x,p.y,3,3)}
  } x.globalAlpha=1;
}
function phase(){
  if(t<.65)return 0;
  if(t<1.35)return 1;
  if(t<2.25)return 2;
  if(t<3.05)return 3;
  if(t<3.48)return 4;
  if(t<4.15)return 5;
  if(t<4.9)return 6;
  return 7;
}
function draw(){
  background();
  let p=phase(), cx=W*.5,cy=H*.49;
  drawBoss();
  drawTaiji(cx,H*.29,Math.min(W,H)*.17);
  drawBagua(cx,H*.29,Math.min(W,H)*.23);
  if(p>=1){
    let n=12;
    for(let i=0;i<n;i++){
      let a=i*TAU/n+t*.9,rad=Math.min(W,H)*.22;
      sword(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad,a+Math.PI/2,70,.72);
    }
  }
  if(p>=2){
    for(let i=0;i<6;i++){
      let a=i*TAU/6-t*.55,rad=Math.min(W,H)*.14;
      sword(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad,a+Math.PI/2,100,.82);
    }
  }
  if(p>=3){
    let a=-Math.PI/2,top=H*.13,bottom=H*.61;
    x.save();x.shadowBlur=28;x.shadowColor='#dff8ff';x.strokeStyle='#f3fbff';x.lineWidth=8;
    x.beginPath();x.moveTo(cx,bottom);x.lineTo(cx,top);x.stroke();
    x.lineWidth=2;x.strokeStyle='#8edbff';x.beginPath();x.moveTo(cx-10,bottom);x.lineTo(cx,top);x.lineTo(cx+10,bottom);x.stroke();x.restore();
  }
  if(p>=4){
    let q=clamp((t-3.05)/.43,0,1),r=Math.min(W,H)*(.08+q*.22);
    glowCircle(cx,H*.29,r,'#ffffff',.95);
    x.save();x.translate(cx,H*.29);x.rotate(q*Math.PI);x.strokeStyle='#fff';x.lineWidth=3;x.globalAlpha=.9;
    x.beginPath();x.moveTo(-r,0);x.lineTo(r,0);x.moveTo(0,-r);x.lineTo(0,r);x.stroke();x.restore();
  }
  if(p>=5){
    let q=clamp((t-3.48)/.67,0,1);
    let y1=H*.62-q*H*.31,y2=H*.62;
    x.save();x.shadowBlur=34;x.shadowColor='#ffffff';x.strokeStyle='#fff';x.lineWidth=11*(1-q*.35);
    x.beginPath();x.moveTo(cx,y1);x.lineTo(cx,y2);x.stroke();x.restore();
  }
  if(p>=6){
    let q=clamp((t-4.15)/.75,0,1),r=Math.min(W,H)*(.05+q*.42);
    x.save();x.globalAlpha=1-q*.45;x.strokeStyle='#fff';x.lineWidth=4;x.shadowBlur=18;x.shadowColor='#fff';
    x.beginPath();x.arc(cx,H*.29,r,0,TAU);x.stroke();x.restore();
    drawBurst(1/60);
  }
  if(p>=7){
    x.fillStyle='rgba(255,255,255,.88)';x.fillRect(0,0,W,H);
    x.fillStyle='rgba(255,255,255,.18)';x.fillRect(0,0,W,H);
  }
  drawHero();
  if(flash>0){x.fillStyle='rgba(255,255,255,'+flash+')';x.fillRect(0,0,W,H)}
}
function loop(now){
  if(!last)last=now;let dt=Math.min((now-last)/1000,.033);last=now;
  if(hitStop>0){hitStop-=dt;dt=0}
  else t+=dt;
  if(t>4.9){t=0;bossHP=1;bossRecoil=0;burst=[]}
  let p=phase();
  if(p>=6 && bossHP===1){bossHP=0;bossRecoil=18;shake=10;flash=.9;emitImpact(W*.5,H*.29)}
  if(bossRecoil>0)bossRecoil*=.86;
  if(shake>0)shake*=.82;
  if(flash>0)flash*=.82;
  x.save();
  if(shake>0)x.translate(rr(-shake,shake),rr(-shake,shake));
  draw();
  x.restore();
  requestAnimationFrame(loop);
}
addEventListener('pointerdown',()=>{t=0;bossHP=1;bossRecoil=0;shake=0;flash=0;burst=[]});
requestAnimationFrame(loop);
</script>
</body>
</html>
