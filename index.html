<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>一枚玉佩｜Alpha 0.3</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0;background:#07111a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;overscroll-behavior:none}
body{touch-action:none}
button{font:inherit}
#app{position:fixed;inset:0;width:100%;height:100%;overflow:hidden}
#hud{position:absolute;top:0;left:0;right:0;height:64px;padding:8px 12px;background:linear-gradient(#13283d,#0a1724);border-bottom:1px solid #45627e;z-index:20}
.row{display:flex;justify-content:space-between;align-items:center}.title{font-size:16px;font-weight:700}.stat{font-size:12px;color:#cbdbea}.gold{color:#ffd66b}
#map{position:absolute;left:0;right:0;top:64px;bottom:54px;overflow:hidden;background:
 radial-gradient(circle at 80% 18%,#345c51 0 8%,transparent 9%),
 linear-gradient(#164237,#0b2b22 60%,#082119)}
#map:before{content:"";position:absolute;inset:0;opacity:.32;background:
 repeating-linear-gradient(25deg,transparent 0 48px,#174b39 49px 52px),
 repeating-linear-gradient(-35deg,transparent 0 72px,#0b3529 73px 76px)}
.land{position:absolute;font-size:64px;filter:drop-shadow(0 8px 6px #0007);z-index:1}
.l1{left:5%;top:10%}.l2{right:5%;top:17%;font-size:58px}.l3{left:18%;bottom:16%;font-size:54px}.l4{right:24%;bottom:13%;font-size:72px}
#player{position:absolute;left:50%;top:51%;width:90px;height:120px;object-fit:contain;object-position:center;transform:translate(-50%,-50%);z-index:5;filter:drop-shadow(0 8px 8px #000);pointer-events:none}
.mon{position:absolute;font-size:38px;z-index:4;filter:drop-shadow(0 5px 5px #000);pointer-events:none}.m1{left:25%;top:28%}.m2{left:70%;top:58%}.m3{left:20%;top:72%}
#zone{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#000b;border:1px solid #ffffff25;padding:7px 13px;border-radius:20px;font-size:12px;z-index:8;white-space:nowrap}
#joystick{position:absolute;left:15px;bottom:15px;width:112px;height:112px;border-radius:50%;background:#ffffff12;border:2px solid #7da2ba88;z-index:10;touch-action:none}
#stick{position:absolute;left:34px;top:34px;width:40px;height:40px;border-radius:50%;background:#84cbe0aa;border:2px solid #d8f5ff}
#explore{position:absolute;right:15px;bottom:20px;width:76px;height:76px;border-radius:50%;border:2px solid #f3d06d;background:linear-gradient(#a27625,#60410f);color:#fff;font-weight:700;z-index:10}
#bottom{position:absolute;left:0;right:0;bottom:0;height:54px;display:flex;background:#07111b;border-top:1px solid #40576d;z-index:30}
#bottom button{flex:1;border:0;background:none;color:#b9c9d8;font-size:11px}.active{color:#ffe17b!important}
.overlay{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.card{width:min(92vw,420px);max-height:calc(100% - 24px);overflow:auto;background:linear-gradient(#172b40,#0b1521);border:1px solid #607995;border-radius:18px;padding:18px;box-shadow:0 20px 60px #000}
.card h2{margin:0 0 6px}.bossImg{display:block;width:145px;height:175px;object-fit:contain;margin:0 auto;filter:drop-shadow(0 8px 10px #000)}.desc{text-align:center;color:#d4e1ed;line-height:1.55;font-size:14px}
.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1;padding:12px;border-radius:12px;border:1px solid #607a95;background:#1d344a;color:#fff}.actions .main{background:#5c43d4}
#battle{position:absolute;inset:0;background:radial-gradient(circle at 50% 18%,#2b506c,#07111a 72%);display:none;z-index:45;overflow:hidden;padding:12px}
.brow{display:flex;justify-content:space-between;font-size:13px}.fighters{display:flex;justify-content:space-around;gap:10px;margin-top:10px}.fighter{width:45%;text-align:center}.portrait{height:145px;display:flex;align-items:center;justify-content:center}.portrait img{max-width:100%;max-height:140px;object-fit:contain;filter:drop-shadow(0 8px 10px #000)}.bar{height:9px;background:#263646;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#63dc83}.enemy i{background:#ed6967}.dmg{height:26px;font-size:20px;font-weight:700;color:#ffd76c}.log{text-align:center;min-height:40px;color:#d8e5ef;font-size:13px}
.skills{position:absolute;left:10px;right:10px;bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.skills button{padding:11px;border-radius:11px;border:1px solid #5b738c;background:#152a3f;color:#fff}.skills button:disabled{opacity:.45}
#toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:#000d;padding:9px 13px;border-radius:12px;border:1px solid #ffffff22;display:none;z-index:80;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
<header id="hud">
  <div class="row"><span class="title">一枚玉佩，改變少年命運</span><b id="realm">凡人</b></div>
  <div class="row stat"><span>修為 <b id="xp">0</b></span><span>靈石 <b id="gold">100</b></span><span>戰力 <b id="power">100</b></span></div>
</header>

<main id="map">
  <div id="zone">青雲山脈・自由探索</div>
  <div class="land l1">⛰️</div><div class="land l2">🌲</div><div class="land l3">🌲</div><div class="land l4">⛰️</div>
  <div class="mon m1">🐺</div><div class="mon m2">🦅</div><div class="mon m3">🐗</div>
  <img id="player" src="assets/主角.png" alt="少年主角">
  <div id="joystick"><div id="stick"></div></div>
  <button id="explore">探索</button>
  <div id="toast"></div>

  <div class="overlay" id="encounter">
    <section class="card">
      <h2 id="encTitle">妖獸出現！</h2>
      <img id="bossImg" class="bossImg" alt="Boss">
      <div class="desc" id="encDesc"></div>
      <div class="actions"><button id="avoid">避開</button><button class="main" id="fight">迎戰</button></div>
    </section>
  </div>

  <section id="battle">
    <div class="brow"><span>⚔️ 戰鬥</span><span id="round">第 1 回合</span></div>
    <div class="fighters">
      <div class="fighter"><div class="portrait"><img id="pimg" src="assets/主角.png"></div><div class="dmg" id="pdmg"></div><div class="bar"><i id="php"></i></div><small>少年 HP <span id="phpText">100/100</span></small></div>
      <div class="fighter"><div class="portrait"><img id="eimg"></div><div class="dmg" id="edmg"></div><div class="bar enemy"><i id="ehp"></i></div><small id="ename">妖獸</small></div>
    </div>
    <div class="log" id="battleLog">選擇招式。</div>
    <div class="skills"><button data-s="slash">青冥斬</button><button data-s="burst">劍氣爆發</button><button data-s="def">防禦</button><button data-s="potion">回氣丹</button></div>
  </section>
</main>

<nav id="bottom">
  <button class="active">🗺️<br>探索</button>
  <button onclick="toast('修煉：戰鬥會獲得修為。')">✨<br>修煉</button>
  <button onclick="toast('背包：Boss 掉落裝備會自動收藏。')">🎒<br>背包</button>
  <button onclick="toast('劇情：玉佩的秘密還在等你發現。')">📖<br>劇情</button>
</nav>
</div>

<script>
const BOSS={
"01_黑甲狼王.png":"assets/01_黑甲狼王.png","02_血羽妖鴉王.png":"assets/02_血羽妖鴉王.png",
"03_玄岩魔猿王.png":"assets/03_玄岩魔猿王.png","04_月影蛇姬.png":"assets/04_月影蛇姬.png",
"05_赤炎妖王.png":"assets/05_赤炎妖王.png","06_九幽龍君.png":"assets/06_九幽龍君.png",
"07_天雷古獸.png":"assets/07_天雷古獸.png","08_玉佩守護神.png":"assets/08_玉佩守護神.png"};
const bosses=[
["黑甲狼王","01_黑甲狼王.png",180,38,130,90,"狼王戰甲"],["血羽妖鴉王","02_血羽妖鴉王.png",210,44,160,110,"血羽披風"],
["玄岩魔猿王","03_玄岩魔猿王.png",250,50,200,140,"玄岩重甲"],["月影蛇姬","04_月影蛇姬.png",290,58,240,170,"月影仙衣"],
["赤炎妖王","05_赤炎妖王.png",330,66,300,210,"赤炎魔劍"],["九幽龍君","06_九幽龍君.png",400,78,420,300,"九幽龍魂劍"],
["天雷古獸","07_天雷古獸.png",480,92,600,420,"雷霆神劍"],["玉佩守護神","08_玉佩守護神.png",600,110,900,666,"玉佩・天命"]];
const ordinary=[["黑甲狼","🐺",60,16,25,18],["血羽妖鴉","🦅",75,19,32,23],["玄岩妖獸","🐗",95,24,45,32]];
let state=JSON.parse(localStorage.getItem("alpha03")||'{"xp":0,"gold":100,"power":100,"realm":"凡人"}');
let enemy=null,battleOn=false,defending=false,turn=1;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("alpha03",JSON.stringify(state));update()}
function update(){$("xp").textContent=state.xp;$("gold").textContent=state.gold;$("power").textContent=state.power;$("realm").textContent=state.realm}
function toast(t){const x=$("toast");x.textContent=t;x.style.display="block";clearTimeout(window._t);window._t=setTimeout(()=>x.style.display="none",1400)}
function openEncounter(){
 if(battleOn)return;
 const boss=Math.random()<.25;
 if(boss){const b=bosses[Math.floor(Math.random()*bosses.length)];enemy={name:b[0],file:b[1],hp:b[2],maxHp:b[2],power:b[3],xp:b[4],gold:b[5],drop:b[6],boss:true}}
 else{const m=ordinary[Math.floor(Math.random()*ordinary.length)];enemy={name:m[0],icon:m[1],hp:m[2],maxHp:m[2],power:m[3],xp:m[4],gold:m[5],boss:false}}
 $("encTitle").textContent=enemy.boss?"⚠️ Boss 妖氣逼近！":"妖獸出現！";
 $("encDesc").textContent=enemy.boss?`${enemy.name} 擋住了你的去路。可以迎戰，也可以避開。`:`${enemy.name} 出現在附近。`;
 $("bossImg").style.display=enemy.boss?"block":"none";if(enemy.boss)$("bossImg").src=BOSS[enemy.file];
 $("encounter").style.display="flex";
}
$("explore").onclick=openEncounter;
$("avoid").onclick=()=>{$("encounter").style.display="none";toast("你避開了這次遭遇。")};
$("fight").onclick=()=>{$("encounter").style.display="none";startBattle()};
function startBattle(){battleOn=true;turn=1;defending=false;state.hp=100;$("battle").style.display="block";$("pimg").src="assets/主角.png";$("eimg").src=enemy.boss?BOSS[enemy.file]:"";$("eimg").style.display=enemy.boss?"block":"none";$("ename").textContent=enemy.name+(enemy.boss?" 👑":"");$("battleLog").textContent="選擇招式。";render()}
function render(){$("php").style.width=state.hp+"%";$("phpText").textContent=state.hp+"/100";$("ehp").style.width=Math.max(0,enemy.hp/enemy.maxHp*100)+"%";$("round").textContent="第 "+turn+" 回合"}
function lock(v){document.querySelectorAll(".skills button").forEach(b=>b.disabled=v)}
document.querySelectorAll(".skills button").forEach(b=>b.onclick=()=>skill(b.dataset.s));
function skill(s){
 if(!battleOn)return;lock(true);$("pdmg").textContent="";$("edmg").textContent="";
 if(s==="potion"){state.hp=Math.min(100,state.hp+35);$("battleLog").textContent="回氣丹生效，恢復 35 HP。"}
 else if(s==="def"){defending=true;$("battleLog").textContent="你架起劍勢，下一次傷害降低。"}
 else{const dmg=s==="burst"?35+Math.floor(Math.random()*16):20+Math.floor(Math.random()*10);enemy.hp=Math.max(0,enemy.hp-dmg);$("edmg").textContent="-"+dmg;$("battleLog").textContent=s==="burst"?"劍氣爆發！":"青冥斬命中！";if(enemy.hp<=0){win();return}}
 render();setTimeout(enemyTurn,450)
}
function enemyTurn(){let dmg=Math.max(4,enemy.power-Math.floor(state.power/6)+Math.floor(Math.random()*8));if(defending){dmg=Math.floor(dmg*.35);defending=false}state.hp=Math.max(0,state.hp-dmg);$("pdmg").textContent="-"+dmg;if(state.hp<=0){$("battleLog").textContent="你敗退了。";setTimeout(()=>{$("battle").style.display="none";battleOn=false;state.hp=100;save();toast("你安全撤退了。")},700);return}$("battleLog").textContent=`${enemy.name} 攻擊，造成 ${dmg} 傷害。`;turn++;render();setTimeout(()=>lock(false),250)}
function win(){state.xp+=enemy.xp;state.gold+=enemy.gold;state.power+=enemy.boss?12:4;if(state.xp>=1000)state.realm="金丹初期";else if(state.xp>=700)state.realm="築基後期";else if(state.xp>=500)state.realm="築基中期";else if(state.xp>=300)state.realm="築基初期";else if(state.xp>=150)state.realm="練氣九層";else if(state.xp>=50)state.realm="練氣三層";else state.realm="凡人";$("battleLog").textContent=`勝利！+${enemy.xp} 修為、+${enemy.gold} 靈石${enemy.boss?"，掉落「"+enemy.drop+"」":""}。`;save();render();setTimeout(()=>{$("battle").style.display="none";battleOn=false;lock(false);toast(enemy.boss?"Boss 掉落："+enemy.drop:"獲得戰利品")},1100)}
update();

/* 鎖定手機可視區域，避免 iPhone 預覽產生整頁捲軸 */
function fit(){const vv=window.visualViewport;const h=vv?vv.height:window.innerHeight;document.documentElement.style.height=h+"px";document.body.style.height=h+"px";$("app").style.height=h+"px"}
window.addEventListener("resize",fit);window.addEventListener("orientationchange",()=>setTimeout(fit,150));if(window.visualViewport)visualViewport.addEventListener("resize",fit);fit();

/* 搖桿：第一階段先控制視角位置，之後再接地圖碰撞 */
const joy=$("joystick"),stick=$("stick");let active=false,jx=0,jy=0;
function moveJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy),m=38;if(d>m){dx*=m/d;dy*=m/d}stick.style.transform=`translate(${dx}px,${dy}px)`;jx=dx/m;jy=dy/m}
joy.addEventListener("pointerdown",e=>{active=true;joy.setPointerCapture(e.pointerId);moveJoy(e)});
joy.addEventListener("pointermove",e=>{if(active)moveJoy(e)});
joy.addEventListener("pointerup",()=>{active=false;jx=jy=0;stick.style.transform="translate(0,0)"});
</script>
</body>
</html>
