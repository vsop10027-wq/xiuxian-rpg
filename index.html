<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>一枚玉佩｜修仙RPG Demo 1.3</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
.app{max-width:430px;margin:auto;min-height:100vh;background:linear-gradient(#07111f,#030811);padding-bottom:18px}
header{padding:14px 12px 8px;text-align:center;font-weight:800;letter-spacing:1px}
.viewer{padding:8px 12px}
.screen{display:none;overflow:hidden;border-radius:18px;border:1px solid #46556a;box-shadow:0 10px 35px #0008;background:#000}
.screen.active{display:block}
.screen img{display:block;width:100%;height:auto}
.nav{position:sticky;bottom:0;background:#07101dee;backdrop-filter:blur(12px);padding:8px 6px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-top:1px solid #334257}
button{border:1px solid #53657d;background:#142238;color:#fff;border-radius:10px;padding:10px 4px;font-weight:700;font-size:13px}
button:active{transform:scale(.97);background:#263b5c}
.hint{text-align:center;color:#9eabc0;font-size:12px;padding:7px 12px}
</style>
</head>
<body>
<div class="app">
<header>一枚玉佩｜改變少年的命運<br><small>Demo 1.3・分離畫面版</small></header>
<div class="viewer"><section class="screen" id="s0"><img src="01_主頁.png" alt="主頁"></section><section class="screen" id="s1"><img src="02_地圖選擇.png" alt="地圖"></section><section class="screen" id="s2"><img src="03_戰鬥.png" alt="戰鬥"></section><section class="screen" id="s3"><img src="04_技能特效.png" alt="技能"></section><section class="screen" id="s4"><img src="05_勝利.png" alt="勝利"></section><section class="screen" id="s5"><img src="06_角色.png" alt="角色"></section><section class="screen" id="s6"><img src="07_背包.png" alt="背包"></section><section class="screen" id="s7"><img src="08_劇情.png" alt="劇情"></section></div>
<div class="hint">每個畫面都是獨立素材，按下方按鈕切換位置</div>
<nav class="nav"><button onclick="showScreen(0)">主頁</button><button onclick="showScreen(1)">地圖</button><button onclick="showScreen(2)">戰鬥</button><button onclick="showScreen(3)">技能</button><button onclick="showScreen(4)">勝利</button><button onclick="showScreen(5)">角色</button><button onclick="showScreen(6)">背包</button><button onclick="showScreen(7)">劇情</button></nav>
</div>
<script>
const screens=[...document.querySelectorAll('.screen')];
function showScreen(i){
  screens.forEach((s,n)=>s.classList.toggle('active',n===i));
  window.scrollTo({top:0,behavior:'smooth'});
}
showScreen(0);
</script>
</body>
</html>
