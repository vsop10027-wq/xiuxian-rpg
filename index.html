<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>一枚玉佩｜Alpha 0.5</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07131d;color:#eef5ff;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
#app{height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:auto;background:#07131d}
.top{flex:0 0 auto;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:linear-gradient(#10253a,#0b1927);border-bottom:1px solid #36546b}
.title{font-size:19px;font-weight:800;display:flex;justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:9px;text-align:center}
.stat b{display:block;color:#ffd66b;font-size:18px}.stat span{font-size:11px;color:#aabed0}
.main{position:relative;flex:1;min-height:0;overflow:hidden}
.screen{position:absolute;inset:0;display:none;overflow:hidden}.screen.active{display:block}
.map{position:absolute;inset:0;background:
radial-gradient(circle at 25% 25%,#225044 0 10%,transparent 11%),
radial-gradient(circle at 75% 55%,#173f37 0 14%,transparent 15%),
linear-gradient(135deg,#124338,#0b302c 48%,#103a31)}
.map:before{content:"";position:absolute;inset:0;opacity:.22;background-image:linear-gradient(30deg,transparent 47%,#79a79a 48%,transparent 49%);background-size:80px 80px}
.zone{position:absolute;left:14px;top:12px;background:#061019d9;border:1px solid #537086;border-radius:20px;padding:8px 14px;font-weight:700;z-index:3}
.questpin{position:absolute;left:18px;top:65px;background:#d79d28;color:#16100a;border-radius:12px;padding:8px 10px;font-size:12px;font-weight:800;z-index:3}
.actor,.mob,.boss{position:absolute;transform:translate(-50%,-50%);z-index:4;user-select:none}
.actor .body{width:30px;height:46px;border-radius:15px 15px 8px 8px;background:linear-gradient(90deg,#e8f4ff,#7ea5c7);border:2px solid #d8efff;box-shadow:0 0 15px #79d9ff}
.actor .head{width:23px;height:23px;border-radius:50%;background:#f1c7a4;border:2px solid #fff;position:absolute;left:3px;top:-16px}
.actor .sword{position:absolute;width:6px;height:39px;background:#bfeeff;right:-11px;top:8px;transform:rotate(35deg);border-radius:5px;box-shadow:0 0 9px #65d9ff}
.mob .shape{width:46px;height:32px;background:#795c48;border-radius:55% 45% 50% 55%;border:2px solid #b6926f;position:relative}
.mob .shape:after{content:"";position:absolute;right:3px;top:8px;width:7px;height:7px;background:#ff5252;border-radius:50%;box-shadow:-1px 0 0 #160a0a}
.mob .name,.boss .name{position:absolute;top:35px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:#ffd66b;text-shadow:0 2px 3px #000;font-weight:800}
.mob.crow .shape{width:48px;height:22px;background:#252b38;border-radius:50% 70% 45% 70%;transform:rotate(-15deg)}
.mob.boar .shape{background:#5b4538;width:52px;height:36px}
.boss{z-index:5}.boss .ring{width:105px;height:105px;border-radius:50%;border:7px dashed #d68b4b;box-shadow:0 0 25px #ff633d55;background:#160f18aa;display:flex;align-items:center;justify-content:center}
.boss .core{width:56px;height:45px;border-radius:50%;background:#191b26;border:3px solid #ff5555;box-shadow:0 0 16px #ff3333}
.joystick{position:absolute;left:18px;bottom:18px;width:128px;height:128px;border-radius:50%;border:3px solid #7897aa66;background:#18314399;z-index:10;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;transform:translate(-50%,-50%);border-radius:50%;background:#8dc1dbbb;border:3px solid #c7ecff}
.action{position:absolute;right:18px;bottom:22px;width:116px;height:116px;border-radius:50%;background:linear-gradient(#dba536,#8c5b16);border:3px solid #f5d37b;z-index:10;font-weight:900;font-size:18px}
.bottom{flex:0 0 auto;height:76px;padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:#06121d;border-top:1px solid #29465c}
.nav{border:0;background:none;font-size:11px;color:#9db1c0}.nav b{display:block;font-size:21px}.nav.active{color:#ffd66b}
.panel{height:100%;overflow:auto;padding:18px 14px 100px;background:linear-gradient(#0b1d2c,#07131d)}
.card{background:#10263a;border:1px solid #35546c;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 8px 22px #0004}
h2{margin:0 0 10px;font-size:20px}h3{margin:0 0 7px}
.bar{height:10px;background:#243847;border-radius:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#63dc8a,#b4ed64)}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center}
.btn{border:1px solid #52718b;background:#16334e;border-radius:12px;padding:11px 13px;font-weight:800}.gold{background:#795519;border-color:#d6ad53}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.quest{border-left:4px solid #e2ad45}.locked{opacity:.5}
.small{font-size:12px;color:#a9bdcb;line-height:1.5}
.enemy{display:flex;gap:12px;align-items:center}.enemyicon{width:58px;height:48px;border-radius:50%;background:#765744;border:2px solid #ba8c69;position:relative}.enemyicon:after{content:"";position:absolute;right:7px;top:13px;width:8px;height:8px;background:#f44;border-radius:50%}
.battle{display:flex;flex-direction:column;height:100%;padding:16px;background:radial-gradient(circle at 50% 25%,#254862,#091621 65%)}
.battlefield{flex:1;position:relative;min-height:240px}.fighter{position:absolute;bottom:18%;left:20%;}.foe{position:absolute;top:25%;right:18%}.damage{position:absolute;color:#ffdf73;font-size:30px;font-weight:900;animation:up .6s ease-out forwards}@keyframes up{to{transform:translateY(-50px);opacity:0}}
.log{background:#07111ad9;border:1px solid #345269;border-radius:12px;padding:10px;min-height:45px;font-size:13px}
.modal{position:absolute;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.modal.show{display:flex}.modalbox{width:min(92%,520px);background:#102337;border:2px solid #d3a544;border-radius:22px;padding:22px;text-align:center}.modalbox h2{color:#ffd66b;font-size:27px}
@media(max-height:700px){.top{padding-top:8px}.bottom{height:68px}.joystick{width:105px;height:105px}.action{width:96px;height:96px}.zone{font-size:12px}}
</style>
</head>
<body>
<div id="app">
<header class="top">
  <div class="title"><span>一枚玉佩，改變少年命運</span><span id="realm">凡人</span></div>
  <div class="stats">
    <div class="stat"><b id="lv">1</b><span>等級</span></div>
    <div class="stat"><b id="xp">0/100</b><span>修為</span></div>
    <div class="stat"><b id="stone">100</b><span>靈石</span></div>
    <div class="stat"><b id="power">100</b><span>戰力</span></div>
  </div>
</header>

<main class="main">
<section id="explore" class="screen active">
  <div class="map" id="map">
    <div class="zone" id="zoneName">青雲山脈・外圍</div>
    <div class="questpin">📜 主線：初入青雲山</div>
    <div class="actor" id="actor" style="left:50%;top:55%"><div class="head"></div><div class="body"></div><div class="sword"></div></div>
    <div class="mob" data-id="wolf" style="left:30%;top:35%"><div class="shape"></div><div class="name">黑甲狼</div></div>
    <div class="mob boar" data-id="boar" style="left:27%;top:77%"><div class="shape"></div><div class="name">山嶽獠牙獸</div></div>
    <div class="mob crow" data-id="crow" style="left:72%;top:58%"><div class="shape"></div><div class="name">血羽妖鴉</div></div>
    <div class="boss" id="boss" style="left:76%;top:26%"><div class="ring"><div class="core"></div></div><div class="name">黑甲狼王・BOSS</div></div>
    <div class="joystick" id="joy"><div class="knob" id="knob"></div></div>
    <button class="action" id="exploreBtn">探索</button>
  </div>
</section>

<section id="quest" class="screen"><div class="panel">
  <div class="card"><h2>📜 主線任務</h2><div id="mainQuest"></div></div>
  <div class="card"><h2>🗺️ 區域進度</h2><div id="zones"></div></div>
  <div class="card"><h2>📖 劇情</h2><p id="story" class="small"></p></div>
</div></section>

<section id="cultivate" class="screen"><div class="panel">
  <div class="card"><h2>✨ 修煉</h2><div class="row"><span>目前修為</span><b id="cultXP">0</b></div><div class="bar" style="margin:10px 0"><div class="fill" id="xpbar" style="width:0%"></div></div><button class="btn gold" style="width:100%" onclick="cultivate()">運轉周天・修煉</button></div>
  <div class="card"><h2>⚔️ 成長</h2><div id="growth"></div></div>
</div></section>

<section id="bag" class="screen"><div class="panel">
  <div class="card"><h2>🎒 背包</h2><div id="inventory"></div></div>
  <div class="card"><h2>🗡️ 裝備</h2><div id="equip"></div></div>
</div></section>

<section id="story" class="screen"><div class="panel">
  <div class="card"><h2>📖 主線故事</h2><div id="storyFull"></div></div>
</div></section>

<section id="battle" class="screen">
 <div class="battle">
   <div class="row"><b id="battleName">黑甲狼</b><span id="turn">第1回合</span></div>
   <div class="battlefield">
     <div class="fighter"><div class="actor"><div class="head"></div><div class="body"></div><div class="sword"></div></div></div>
     <div class="foe"><div class="enemyicon" id="foeIcon"></div><div style="text-align:center;margin-top:5px;font-weight:800" id="foeLabel">黑甲狼</div></div>
   </div>
   <div class="card" style="margin:0 0 8px"><div class="row"><span>少年 HP</span><b id="playerHP">100/100</b></div><div class="bar"><div class="fill" id="playerHPbar" style="width:100%"></div></div><div class="row" style="margin-top:9px"><span>敵方 HP</span><b id="enemyHP">50/50</b></div><div class="bar"><div class="fill" id="enemyHPbar" style="width:100%"></div></div></div>
   <div class="grid"><button class="btn" onclick="attack(12,'青冥斬')">青冥斬</button><button class="btn" onclick="attack(22,'劍氣爆發')">劍氣爆發</button><button class="btn" onclick="defend()">防禦</button><button class="btn" onclick="potion()">回氣丹</button></div>
   <div class="log" id="battleLog" style="margin-top:8px"></div>
 </div>
</section>

<div class="modal" id="modal"><div class="modalbox"><h2 id="modalTitle"></h2><p id="modalText"></p><button class="btn gold" onclick="closeModal()">繼續</button></div></div>
</main>

<nav class="bottom">
 <button class="nav active" data-go="explore">🗺️<b>探索</b></button>
 <button class="nav" data-go="quest">📜<b>任務</b></button>
 <button class="nav" data-go="cultivate">✨<b>修煉</b></button>
 <button class="nav" data-go="bag">🎒<b>背包</b></button>
</nav>
</div>

<script>
const defaultState={
 level:1,xp:0,stone:100,power:100,hp:100,items:{回氣丹:3},equip:[],
 quest:0, kills:0,boss:false, zone:0,storyStep:0
};
let S=JSON.parse(localStorage.getItem('xiu_alpha05')||'null')||structuredClone(defaultState);
let battle=null, defending=false, moving=false, joyStart=null;

const quests=[
 {title:'初入青雲山',desc:'擊敗 2 隻外圍妖獸',need:2,type:'kill',reward:'修為 +60、靈石 +30'},
 {title:'玉佩異動',desc:'修煉 3 次，讓玉佩覺醒',need:3,type:'cult',reward:'解鎖「劍氣爆發」'},
 {title:'狼王妖氣',desc:'前往妖氣區並擊敗黑甲狼王',need:1,type:'boss',reward:'解鎖青雲山脈・深處'},
 {title:'血羽谷',desc:'擊敗 3 隻血羽妖鴉',need:3,type:'crow',reward:'解鎖新區域與裝備系統'},
 {title:'古洞試煉',desc:'擊敗 2 隻山嶽獠牙獸',need:2,type:'boar',reward:'開啟築基主線'}
];
const mobs={
 wolf:{name:'黑甲狼',hp:50,power:8,xp:28,stone:10},
 crow:{name:'血羽妖鴉',hp:62,power:10,xp:34,stone:14},
 boar:{name:'山嶽獠牙獸',hp:78,power:12,xp:42,stone:18},
 boss:{name:'黑甲狼王',hp:160,power:18,xp:100,stone:60,boss:true}
};
function save(){localStorage.setItem('xiu_alpha05',JSON.stringify(S));}
function realm(){if(S.level<3)return'凡人';if(S.level<6)return'練氣初期';if(S.level<10)return'練氣中期';if(S.level<15)return'練氣後期';if(S.level<20)return'築基初期';return'築基中期';}
function need(){return 100+(S.level-1)*45}
function addXP(n){S.xp+=n;while(S.xp>=need()){S.xp-=need();S.level++;S.power+=12;S.hp=100;showModal('境界突破！',`你達到 Lv.${S.level}｜${realm()}<br>戰力 +12`)}}
function render(){
 document.getElementById('realm').textContent=realm();document.getElementById('lv').textContent=S.level;
 document.getElementById('xp').textContent=`${S.xp}/${need()}`;document.getElementById('stone').textContent=S.stone;document.getElementById('power').textContent=S.power;
 document.getElementById('cultXP').textContent=S.xp;document.getElementById('xpbar').style.width=(S.xp/need()*100)+'%';
 const q=quests[S.quest]||quests[quests.length-1];
 document.getElementById('mainQuest').innerHTML=`<div class="quest card"><h3>${q.title}</h3><p>${q.desc}</p><b>獎勵：${q.reward}</b></div>`;
 document.getElementById('story').textContent=storyText();
 document.getElementById('storyFull').innerHTML=quests.slice(0,S.quest+1).map((x,i)=>`<div class="card"><b>第${i+1}節｜${x.title}</b><p class="small">${storyFor(i)}</p></div>`).join('');
 document.getElementById('growth').innerHTML=`Lv.${S.level}｜${realm()}｜戰力 ${S.power}<br>下一級需要修為 ${need()}`;
 document.getElementById('inventory').innerHTML=Object.entries(S.items).map(([k,v])=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #284355"><span>${k}</span><b>x${v}</b></div>`).join('')||'目前沒有物品';
 document.getElementById('equip').innerHTML=S.equip.length?S.equip.map(x=>`<div>🟣 ${x}</div>`).join(''):'尚未取得裝備';
 document.getElementById('zones').innerHTML=`<div class="${S.zone>=0?'card':'card locked'}">青雲山脈・外圍　${S.zone>=0?'已開放':'未開放'}</div><div class="${S.zone>=1?'card':'card locked'}">青雲山脈・深處　${S.zone>=1?'已開放':'擊敗狼王後開放'}</div><div class="${S.zone>=2?'card':'card locked'}">血羽谷　${S.zone>=2?'已開放':'完成前置主線後開放'}</div>`;
 save();
}
function storyFor(i){return['你在山門外醒來，玉佩微微發光。前方就是青雲山脈。','玉佩吸收靈氣後出現第一道裂紋，似乎封印著某種力量。','妖氣區深處傳來狼嚎，你第一次感受到真正的妖王威壓。','血羽妖鴉盤踞山谷，玉佩開始對某種古老力量產生共鳴。','古洞入口刻著與玉佩相同的紋路，你的身世開始浮出水面。'][i]||'更深的道路正在等待你。'}
function storyText(){return storyFor(Math.min(S.quest,4))}
function cultivate(){addXP(24);S.items.回氣丹=(S.items.回氣丹||3); if(S.quest===1){S.cultCount=(S.cultCount||0)+1;if(S.cultCount>=3){S.quest=2;S.storyStep=2;showModal('主線更新','玉佩覺醒了一道新的力量。前往妖氣區挑戰狼王！')}};render()}
function startBattle(id){
 const e=mobs[id];battle={id,...e,max:e.hp};S.hp=Math.min(100,S.hp);defending=false;
 document.getElementById('battleName').textContent=e.name;document.getElementById('foeLabel').textContent=e.name;document.getElementById('enemyHP').textContent=`${e.hp}/${e.hp}`;document.getElementById('playerHP').textContent=`${S.hp}/100`;document.getElementById('battleLog').textContent=`你遇到了${e.name}！`;
 document.getElementById('battle').classList.add('active');document.getElementById('explore').classList.remove('active');updateBattle();
}
function updateBattle(){if(!battle)return;document.getElementById('enemyHPbar').style.width=(battle.hp/battle.max*100)+'%';document.getElementById('playerHPbar').style.width=(S.hp/100*100)+'%';document.getElementById('enemyHP').textContent=`${Math.max(0,battle.hp)}/${battle.max}`;document.getElementById('playerHP').textContent=`${Math.max(0,S.hp)}/100`;}
function enemyTurn(){let d=Math.max(2,battle.power-(S.power>120?3:0));if(defending)d=Math.floor(d/2);S.hp-=d;defending=false;document.getElementById('battleLog').textContent=`${battle.name} 攻擊，你受到 ${d} 傷害。`;if(S.hp<=0){S.hp=100;showModal('戰鬥失敗','你被迫撤回安全區。修為沒有損失。');leaveBattle();}}
function attack(d,name){if(!battle)return;battle.hp-=d+Math.floor(S.power/30);document.getElementById('battleLog').textContent=`${name} 命中 ${battle.name}！`;if(battle.hp<=0){winBattle();return}enemyTurn();updateBattle();}
function defend(){defending=true;document.getElementById('battleLog').textContent='你擺出防禦姿態，本回合受到的傷害降低。';enemyTurn();updateBattle();}
function potion(){if((S.items.回氣丹||0)<=0){document.getElementById('battleLog').textContent='沒有回氣丹了。';return}S.items.回氣丹--;S.hp=Math.min(100,S.hp+30);document.getElementById('battleLog').textContent='使用回氣丹，恢復 30 HP。';enemyTurn();updateBattle();}
function winBattle(){const b=battle;S.stone+=b.stone;addXP(b.xp);S.kills++;if(b.boss){S.boss=true;S.zone=1;if(S.quest===2)S.quest=3;S.equip.push('狼王戰甲');showModal('BOSS擊破！',`你擊敗了${b.name}<br>修為 +${b.xp}｜靈石 +${b.stone}<br>獲得：狼王戰甲`)}else{if(b.id==='crow')S.crowKills=(S.crowKills||0)+1;if(b.id==='boar')S.boarKills=(S.boarKills||0)+1;advanceQuest(b.id);showModal('戰鬥勝利',`擊敗 ${b.name}<br>修為 +${b.xp}｜靈石 +${b.stone}`)}save();updateBattle();}
function advanceQuest(id){const q=quests[S.quest];if(!q)return;if(q.type==='kill'&&S.kills>=2)S.quest=1;if(q.type==='crow'&&(S.crowKills||0)>=3)S.quest=4;if(q.type==='boar'&&(S.boarKills||0)>=2)S.quest=5;if(S.quest===1&&!S.cultCount)S.cultCount=0;}
function leaveBattle(){battle=null;document.getElementById('battle').classList.remove('active');document.getElementById('explore').classList.add('active');render();}
function showModal(t,x){document.getElementById('modalTitle').textContent=t;document.getElementById('modalText').innerHTML=x;document.getElementById('modal').classList.add('show');render()}
function closeModal(){document.getElementById('modal').classList.remove('show');if(!battle)render();}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(n.dataset.go).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));n.classList.add('active');render()});
document.getElementById('exploreBtn').onclick=()=>{const r=Math.random();if(r<.22)startBattle('boss');else if(r<.55)startBattle('crow');else if(r<.78)startBattle('boar');else startBattle('wolf')};
document.querySelectorAll('.mob').forEach(m=>m.addEventListener('click',()=>startBattle(m.dataset.id)));
document.getElementById('boss').addEventListener('click',()=>startBattle('boss'));

// 虛擬搖桿：移動主角，靠近敵人時可直接觸發遭遇
const joy=document.getElementById('joy'),knob=document.getElementById('knob'),actor=document.getElementById('actor');
function moveJoy(x,y){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy;const max=r.width*.32;const len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;const ar=actor.getBoundingClientRect(),mr=document.getElementById('map').getBoundingClientRect();let nx=ar.left+dx*.18,ny=ar.top+dy*.18;nx=Math.max(mr.left+25,Math.min(mr.right-25,nx));ny=Math.max(mr.top+80,Math.min(mr.bottom-100,ny));actor.style.left=((nx-mr.left)/mr.width*100)+'%';actor.style.top=((ny-mr.top)/mr.height*100)+'%';}
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);moveJoy(e.clientX,e.clientY)});
joy.addEventListener('pointermove',e=>{if(e.buttons)moveJoy(e.clientX,e.clientY)});
joy.addEventListener('pointerup',()=>knob.style.transform='translate(-50%,-50%)');
render();
</script>
</body>
</html>
