<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>天命・破界 V5｜連貫修仙技能演出</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;text-align:center}
.title{margin-top:23px;font-size:25px;font-weight:900;letter-spacing:5px;text-shadow:0 0 12px #fff,0 0 32px #55e8ff}
.sub{font-size:12px;opacity:.72;letter-spacing:2px;margin-top:5px}
#chant{position:absolute;left:0;right:0;top:42%;font-size:29px;font-weight:900;letter-spacing:9px;opacity:0;text-shadow:0 0 12px #fff,0 0 35px #59e7ff}
#dmg{position:absolute;left:0;right:0;top:51%;font-size:39px;font-weight:900;opacity:0;text-shadow:0 0 12px #fff,0 0 32px #f6d365}
#cast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);pointer-events:auto;border:1px solid #9ef3dc;border-radius:999px;padding:15px 30px;background:linear-gradient(180deg,#18483d,#061a18);color:#fff;font-size:18px;font-weight:900;box-shadow:0 0 25px #20c9a6,inset 0 0 20px #0e766d}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
<div class="title">天命・破界</div>
<div class="sub">連貫修仙演出 V5｜靈氣・劍陣・天命神劍</div>
<div id="chant"></div><div id="dmg">999,999,999</div>
<button id="cast">⚔ 施放天命・破界</button>
</div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),btn=document.getElementById('cast'),chant=document.getElementById('chant'),dmg=document.getElementById('dmg');
let W,H,D=1,run=false,t0=0,last=0,parts=[],shock=[],flash=0,shake=0,done=false;
const R=(a,b)=>a+Math.random()*(b-a);
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
function P(x,y,col,n=1,sp=5){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=R(.4,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:R(.8,3.5),life:R(30,90),m:90,col})}}
function S(r,col='#fff'){shock.push({r:5,max:r,life:34,col})}
function bg(t){
 let q=g.createRadialGradient(W/2,H*.48,10,W/2,H*.48,Math.max(W,H)*.72);
 q.addColorStop(0,'#19345c');q.addColorStop(.45,'#07162c');q.addColorStop(1,'#01030a');g.fillStyle=q;g.fillRect(0,0,W,H);
 g.globalAlpha=.28;
 for(let i=0;i<115;i++){let x=(i*83)%W,y=(i*151)%H;g.fillStyle=i%7===0?'#f4d78d':'#cdefff';g.fillRect(x,y,1.4,1.4)}
 g.globalAlpha=1;
 // distant mountains and cloud sea
 g.save();g.globalAlpha=.3;g.fillStyle='#0a1930';g.beginPath();g.moveTo(0,H*.7);g.lineTo(W*.12,H*.54);g.lineTo(W*.24,H*.67);g.lineTo(W*.41,H*.5);g.lineTo(W*.55,H*.68);g.lineTo(W*.72,H*.48);g.lineTo(W,H*.66);g.lineTo(W,H);g.lineTo(0,H);g.closePath();g.fill();g.restore();
 g.save();g.globalAlpha=.13;g.strokeStyle='#82eaff';g.lineWidth=2;
 for(let k=0;k<5;k++){g.beginPath();for(let i=0;i<120;i++){let u=i/119,x=u*W,y=H*(.61+k*.04)+Math.sin(u*14+k+t*.00045)*10+Math.sin(u*29)*4;i?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}g.restore();
}
function rings(cx,cy,r,t,a=1){
 g.save();g.translate(cx,cy);g.rotate(t*.00016);g.globalAlpha=a;
 for(let k=0;k<5;k++){g.strokeStyle=k%2?'#67e8ff':'#f3d78d';g.lineWidth=1.3+k*.35;g.shadowBlur=18;g.shadowColor=k%2?'#67e8ff':'#f3d78d';g.beginPath();g.arc(0,0,r-k*18,0,Math.PI*2);g.stroke()}
 for(let i=0;i<16;i++){g.save();g.rotate(i*Math.PI/8);g.strokeStyle=i%2?'#bff7ff':'#f7dda0';g.lineWidth=1;g.beginPath();g.moveTo(r-46,0);g.lineTo(r,0);g.stroke();g.restore()}
 g.restore();
}
function rune(cx,cy,r,a,t){
 g.save();g.translate(cx,cy);g.rotate(-t*.0002);g.globalAlpha=a;g.strokeStyle='#f7d98e';g.lineWidth=1.2;g.shadowBlur=15;g.shadowColor='#f7d98e';
 for(let i=0;i<8;i++){let ang=i*Math.PI/4;g.save();g.rotate(ang);g.beginPath();g.moveTo(r*.72,0);g.lineTo(r*.92,0);g.stroke();g.beginPath();g.moveTo(r*.83,-5);g.lineTo(r*.83,5);g.stroke();g.restore()}g.restore();
}
function sword(cx,cy,a,len,scale){
 g.save();let x=cx+Math.cos(a)*len*.40,y=cy+Math.sin(a)*len*.40;g.translate(x,y);g.rotate(a+Math.PI/2);g.scale(scale,scale);
 g.shadowBlur=22;g.shadowColor='#62eaff';
 let q=g.createLinearGradient(0,-len,0,28);q.addColorStop(0,'#ffffff');q.addColorStop(.35,'#c8f7ff');q.addColorStop(.75,'#67dfff');q.addColorStop(1,'#f1d17f');
 g.fillStyle=q;g.beginPath();g.moveTo(0,-len);g.lineTo(11,-len*.68);g.lineTo(7,5);g.lineTo(0,28);g.lineTo(-7,5);g.lineTo(-11,-len*.68);g.closePath();g.fill();
 g.strokeStyle='#f5d78d';g.lineWidth=2;g.beginPath();g.moveTo(-15,15);g.lineTo(15,15);g.stroke();
 g.restore();
}
function divineSword(cx,cy,p){
 g.save();g.translate(cx,cy);g.shadowBlur=45;g.shadowColor='#5ee8ff';
 let L=H*(.45+.08*Math.sin(p*3)),q=g.createLinearGradient(0,-L,0,100);q.addColorStop(0,'#ffffff');q.addColorStop(.35,'#d7fbff');q.addColorStop(.72,'#69dcff');q.addColorStop(1,'#f4d48a');
 g.fillStyle=q;g.beginPath();g.moveTo(0,-L);g.lineTo(27,-L*.72);g.lineTo(14,58);g.lineTo(0,108);g.lineTo(-14,58);g.lineTo(-27,-L*.72);g.closePath();g.fill();
 g.strokeStyle='#f5d88e';g.lineWidth=3;g.beginPath();g.moveTo(-46,4);g.lineTo(46,4);g.stroke();
 g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=1.2;g.beginPath();g.moveTo(-8,-L*.8);g.lineTo(0,60);g.lineTo(8,-L*.8);g.stroke();
 g.restore();
}
function slash(cx,cy,p){
 g.save();g.translate(cx,cy);g.rotate(-.12);
 let L=W*1.25,gr=g.createLinearGradient(-L/2,0,L/2,0);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.45,'rgba(190,247,255,.85)');gr.addColorStop(.5,'#fff');gr.addColorStop(.55,'rgba(247,215,141,.8)');gr.addColorStop(1,'rgba(255,255,255,0)');
 g.fillStyle=gr;g.shadowBlur=35;g.shadowColor='#74eaff';g.beginPath();g.moveTo(-L/2,8);g.quadraticCurveTo(0,-22,L/2,8);g.lineTo(L/2,-6);g.quadraticCurveTo(0,-42,-L/2,-6);g.closePath();g.fill();
 g.strokeStyle='#eaffff';g.lineWidth=3;g.beginPath();g.moveTo(-L/2,2);g.quadraticCurveTo(0,-35,L/2,2);g.stroke();g.restore();
}
function update(t){let dt=Math.min(2,(t-(last||t))/16.67);last=t;parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy*=.985;p.life-=dt});parts=parts.filter(p=>p.life>0);shock.forEach(s=>{s.r+=(s.max-s.r)*.18*dt;s.life-=dt});shock=shock.filter(s=>s.life>0);shake*=.86;flash*=.82}
function render(t){
 update(t);g.save();if(shake>1)g.translate(R(-shake,shake),R(-shake,shake));bg(t);
 let p=run?(t-t0)/1000:0,cx=W/2,cy=H*.47;
 if(run){
  // 0-1.1 gather qi
  if(p<1.1){let a=p/1.1;rings(cx,cy,Math.min(W,H)*(.10+.10*a),t,.25+.5*a);P(cx,H*.70,'#58e6d0',5,4);P(cx,cy,'#67e8ff',3,3)}
  // 1.0-2.0 jade resonance / first formation
  if(p>=.95&&p<2.0){rings(cx,cy,Math.min(W,H)*(.20+.13*(p-.95)),t,.75);rune(cx,cy,Math.min(W,H)*.25,1,t);P(cx,cy,'#f2d78e',5,5)}
  // 1.7-3.25 sword formation: grows from qi, not abrupt
  if(p>=1.7&&p<3.25){
   let a=Math.min(1,(p-1.7)/1.2),n=Math.floor(36*a),base=t*.00035;
   rings(cx,cy,Math.min(W,H)*.35,t,.9);rune(cx,cy,Math.min(W,H)*.38,.9,t);
   for(let i=0;i<n;i++){let ang=i/36*Math.PI*2+base;sword(cx,cy,ang,Math.min(W,H)*(.30+.08*Math.sin(i)),.55+.3*a)}
   P(cx,cy,'#bdf7ff',6,7);
  }
  // 3.0-3.7 convergence
  if(p>=3.0&&p<3.7){
   chant.textContent='萬　劍　歸　宗';chant.style.opacity=Math.min(1,(p-3)*4);
   rings(cx,cy,Math.min(W,H)*.42,t,.95);rune(cx,cy,Math.min(W,H)*.42,1,t);
   let k=Math.min(1,(p-3)/.7);
   for(let i=0;i<18;i++){let ang=i/18*Math.PI*2;let rr=(1-k)*Math.min(W,H)*.32;let sx=cx+Math.cos(ang)*rr,sy=cy+Math.sin(ang)*rr;g.strokeStyle='rgba(220,250,255,.9)';g.lineWidth=2;g.beginPath();g.moveTo(sx,sy);g.lineTo(cx,cy);g.stroke()}
   P(cx,cy,'#f7d88c',10,6);
  }
  // 3.6-4.25 divine sword birth
  if(p>=3.6&&p<4.25){
   chant.textContent='天　命　神　劍';chant.style.opacity=1;
   rings(cx,cy,Math.min(W,H)*.43,t,1);rune(cx,cy,Math.min(W,H)*.43,1,t);
   divineSword(cx,cy,(p-3.6)/.65);
   P(cx,cy,'#ffffff',8,7);
  }
  // 4.2-4.65 silence + slash preparation
  if(p>=4.2&&p<4.7){
   chant.textContent='劍　來';chant.style.opacity=1;
   g.save();g.globalAlpha=Math.min(1,(p-4.2)/.25);g.strokeStyle='#fff';g.shadowBlur=30;g.shadowColor='#67e8ff';g.lineWidth=2;g.beginPath();g.arc(cx,cy,Math.min(W,H)*.46,0,Math.PI*2);g.stroke();g.restore();
  }
  // 4.7-5.15 final slash
  if(p>=4.7&&p<5.15){
   chant.textContent='天　命・破　界';chant.style.opacity=1;
   slash(cx,cy,Math.min(1,(p-4.7)/.45));flash=.18;shake=12;
   if(!done){done=true;setTimeout(()=>{dmg.style.opacity=1;dmg.animate([{transform:'scale(.3)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:650})},90)}
   P(cx,cy,'#fff',18,12);P(cx,cy,'#67e8ff',16,11);P(cx,cy,'#f6d36b',10,9);
  }
  // 5.15-5.9 aftermath
  if(p>=5.15&&p<5.9){flash=.45*Math.max(0,1-(p-5.15)/.75);shake*=.95;chant.textContent='天地一劍 · 破界';chant.style.opacity=.95;rings(cx,cy,Math.max(W,H)*.58,t,Math.max(0,1-(p-5.15)/.8));}
  if(p>=5.9){run=false;btn.textContent='⚔ 再次施放'}
 }
 for(const s of shock){g.save();g.globalAlpha=s.life/34;g.strokeStyle=s.col;g.shadowBlur=25;g.shadowColor=s.col;g.lineWidth=4;g.beginPath();g.arc(cx,cy,s.r,0,Math.PI*2);g.stroke();g.restore()}
 for(const q of parts){g.save();g.globalAlpha=q.life/q.m;g.fillStyle=q.col;g.shadowBlur=15;g.shadowColor=q.col;g.beginPath();g.arc(q.x,q.y,q.r,0,Math.PI*2);g.fill();g.restore()}
 if(flash>.01){g.fillStyle=`rgba(255,255,255,${flash*.65})`;g.fillRect(0,0,W,H)}
 g.restore();requestAnimationFrame(render)
}
btn.onclick=()=>{run=true;t0=performance.now();last=0;parts=[];shock=[];flash=0;shake=0;done=false;chant.style.opacity=0;dmg.style.opacity=0;btn.textContent='⚔ 技能演出中…'};
requestAnimationFrame(render);
</script>
</body>
</html>
