<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>天命・破界｜V2.4 全螢幕Boss演出</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050d;touch-action:none}
canvas{display:block;width:100%;height:100%}
#title{position:fixed;top:8.5%;left:0;width:100%;text-align:center;color:#f3fbff;
font:800 29px system-ui;letter-spacing:5px;text-shadow:0 0 18px #62eaff;pointer-events:none}
#sub{position:fixed;top:13.5%;left:0;width:100%;text-align:center;color:#a9d8e4;
font:500 12px system-ui;letter-spacing:3px;opacity:.9;pointer-events:none}
#hint{position:fixed;bottom:4.2%;left:50%;transform:translateX(-50%);
color:#dffaff;font:600 13px system-ui;letter-spacing:2px;text-shadow:0 0 12px #54eaff;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">天命・破界</div>
<div id="sub">太極開天 · 八卦鎮魂 · 萬劍歸宗</div>
<div id="hint">點擊畫面重新施放</div>
<script>
(()=> {
const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});
let W,H,D=1,start=performance.now();
const TAU=Math.PI*2;
function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize,{passive:true});resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
function label(s,y,a=1){ctx.save();ctx.globalAlpha=a;ctx.textAlign='center';ctx.font='700 25px system-ui';ctx.fillStyle='#effcff';ctx.shadowBlur=15;ctx.shadowColor='#53eaff';ctx.fillText(s,W/2,y);ctx.restore()}
function taiji(cx,cy,r,rot,a){
 ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.globalAlpha=a;
 ctx.shadowBlur=22;ctx.shadowColor='rgba(241,202,91,.6)';
 ctx.fillStyle='#f1d16f';ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();
 ctx.fillStyle='#080d19';
 ctx.beginPath();ctx.arc(0,0,r,Math.PI/2,Math.PI*1.5,false);
 ctx.arc(0,-r/2,r/2,Math.PI*1.5,Math.PI/2,false);
 ctx.arc(0,r/2,r/2,Math.PI/2,Math.PI*1.5,false);ctx.closePath();ctx.fill();
 ctx.fillStyle='#080d19';ctx.beginPath();ctx.arc(0,-r/2,r*.12,0,TAU);ctx.fill();
 ctx.fillStyle='#f1d16f';ctx.beginPath();ctx.arc(0,r/2,r*.12,0,TAU);ctx.fill();
 ctx.strokeStyle='#ffe28b';ctx.lineWidth=2;ctx.shadowBlur=7;ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.stroke();
 ctx.restore();
}
function bagua(cx,cy,r,rot,a){
 ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.globalAlpha=a;
 ctx.strokeStyle='#f0ce6b';ctx.lineWidth=2;ctx.shadowBlur=12;ctx.shadowColor='#edc95e';
 ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.stroke();
 ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,0,r*.84,0,TAU);ctx.stroke();
 for(let i=0;i<8;i++){
  const q=i*TAU/8;ctx.save();ctx.rotate(q);ctx.translate(0,-r*.91);
  for(let j=-1;j<=1;j++){
   const yy=j*8;ctx.lineWidth=4.5;ctx.strokeStyle='#f4d477';ctx.shadowBlur=0;
   const broken=(i===1||i===4||i===6)&&j!==0;
   if(broken){ctx.beginPath();ctx.moveTo(-15,yy);ctx.lineTo(-4,yy);ctx.stroke();ctx.beginPath();ctx.moveTo(4,yy);ctx.lineTo(15,yy);ctx.stroke()}
   else{ctx.beginPath();ctx.moveTo(-15,yy);ctx.lineTo(15,yy);ctx.stroke()}
  }
  ctx.restore();
 }
 ctx.restore();
}
function sword(cx,cy,len,ang,sc=1,a=1,hot=false){
 ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);ctx.globalAlpha=a;
 const L=len*sc;ctx.shadowBlur=hot?24:11;ctx.shadowColor=hot?'#ffe37b':'#61eaff';
 const gr=ctx.createLinearGradient(0,-L*.55,0,L*.5);
 gr.addColorStop(0,'#ffffff');gr.addColorStop(.42,'#d9fbff');gr.addColorStop(.75,hot?'#fff0a5':'#7be5f6');gr.addColorStop(1,'#c79b38');
 ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(0,-L*.56);ctx.lineTo(L*.1,-L*.34);ctx.lineTo(L*.055,L*.29);ctx.lineTo(0,L*.47);ctx.lineTo(-L*.055,L*.29);ctx.lineTo(-L*.1,-L*.34);ctx.closePath();ctx.fill();
 ctx.shadowBlur=0;ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-L*.48);ctx.lineTo(0,L*.36);ctx.stroke();
 ctx.strokeStyle='#f2ca60';ctx.lineWidth=Math.max(2,3*sc);ctx.beginPath();ctx.moveTo(-L*.15,L*.31);ctx.lineTo(L*.15,L*.31);ctx.stroke();
 ctx.strokeStyle='#755427';ctx.lineWidth=Math.max(3,5*sc);ctx.beginPath();ctx.moveTo(0,L*.34);ctx.lineTo(0,L*.5);ctx.stroke();
 ctx.restore();
}
function hero(cx,cy,sc,attack){
 ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);
 ctx.globalAlpha=.95;ctx.shadowBlur=18;ctx.shadowColor='#62eaff';
 ctx.fillStyle='#e9fbff';ctx.beginPath();ctx.arc(0,-45,12,0,TAU);ctx.fill();
 ctx.fillStyle='#18334a';ctx.beginPath();ctx.moveTo(-17,-25);ctx.lineTo(17,-25);ctx.lineTo(30,48);ctx.lineTo(0,68);ctx.lineTo(-30,48);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#78eaff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-10,-20);ctx.lineTo(0,48);ctx.lineTo(10,-20);ctx.stroke();
 ctx.strokeStyle='#f1ce66';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(15,5);ctx.lineTo(53,-38);ctx.stroke();
 if(attack){ctx.strokeStyle='#dffcff';ctx.lineWidth=4;ctx.shadowBlur=16;ctx.beginPath();ctx.moveTo(50,-40);ctx.lineTo(88,-72);ctx.stroke()}
 ctx.restore();
}
function boss(cx,cy,sc,hp,hit){
 ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);
 ctx.shadowBlur=hit?30:20;ctx.shadowColor=hit?'#ff6b52':'#a52a3d';
 ctx.fillStyle='#15111b';ctx.beginPath();ctx.moveTo(-105,70);ctx.quadraticCurveTo(-140,-5,-78,-95);ctx.lineTo(-40,-132);ctx.lineTo(-14,-93);ctx.lineTo(8,-145);ctx.lineTo(44,-95);ctx.quadraticCurveTo(120,-65,112,55);ctx.lineTo(65,108);ctx.lineTo(-68,108);ctx.closePath();ctx.fill();
 ctx.fillStyle='#552733';ctx.beginPath();ctx.moveTo(-44,-95);ctx.lineTo(-95,-165);ctx.lineTo(-24,-115);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(44,-95);ctx.lineTo(95,-165);ctx.lineTo(24,-115);ctx.closePath();ctx.fill();
 ctx.fillStyle='#ff5341';ctx.shadowBlur=16;ctx.beginPath();ctx.ellipse(-37,-57,14,8,-.18,0,TAU);ctx.ellipse(37,-57,14,8,.18,0,TAU);ctx.fill();
 ctx.fillStyle='#8b1832';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(0,8,27,0,TAU);ctx.fill();
 ctx.restore();
 const bw=170,bh=8,x=cx-bw/2,y=cy-sc*160;
 ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(x,y,bw,bh);ctx.fillStyle='#df4053';ctx.shadowBlur=8;ctx.shadowColor='#ff4050';ctx.fillRect(x,y,bw*clamp(hp,0,1),bh);ctx.shadowBlur=0;
}
function particles(cx,cy,r,n,seed,a,col){
 ctx.save();ctx.globalAlpha=a;ctx.fillStyle=col;
 for(let i=0;i<n;i++){let k=i+seed*29,an=(Math.sin(k*13.1)*.5+.5)*TAU,rr=r*(.2+.8*(Math.sin(k*7.7)*.5+.5));ctx.beginPath();ctx.arc(cx+Math.cos(an)*rr,cy+Math.sin(an)*rr*.55,1+(Math.sin(k*2.9)+1)*.65,0,TAU);ctx.fill()}
 ctx.restore();
}
function slash(p){
 ctx.save();ctx.translate(W/2,H*.47);ctx.rotate(-.25);ctx.globalAlpha=.96;ctx.shadowBlur=32;ctx.shadowColor='#63eaff';
 const gr=ctx.createLinearGradient(-W*.65,0,W*.65,0);gr.addColorStop(0,'rgba(70,225,255,0)');gr.addColorStop(.43,'#dffcff');gr.addColorStop(.53,'#fff1a3');gr.addColorStop(1,'rgba(255,210,80,0)');
 ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(-W*.62,-7-20*p);ctx.quadraticCurveTo(0,-58,W*.62,0);ctx.quadraticCurveTo(0,58,-W*.62,7+20*p);ctx.fill();ctx.restore();
}
function draw(now){
 const t=((now-start)/1000)%7.4;
 ctx.clearRect(0,0,W,H);
 let bg=ctx.createRadialGradient(W*.5,H*.44,20,W*.5,H*.44,Math.max(W,H)*.8);
 bg.addColorStop(0,'#172b4c');bg.addColorStop(.42,'#091225');bg.addColorStop(1,'#01040b');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 // atmospheric layers
 ctx.fillStyle='rgba(78,113,150,.15)';ctx.beginPath();ctx.moveTo(0,H*.52);ctx.lineTo(W*.18,H*.36);ctx.lineTo(W*.34,H*.53);ctx.lineTo(W*.5,H*.31);ctx.lineTo(W*.69,H*.52);ctx.lineTo(W*.86,H*.37);ctx.lineTo(W,H*.54);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();

 const cx=W*.5, coreY=H*.47, heroY=H*.80;
 let hp=1,hit=0;if(t>8.25&&t<8.9)hit=ease((t-8.25)/.65);if(t>=8.9)hp=.25;if(t>=10.2)hp=.08;
 // keep combat readable: boss upper-middle, hero bottom
 boss(cx,coreY-30,Math.min(W,H)/820,hp,hit>0);

 if(t<1.05){
   const p=ease(t/2),r=95+150*p;
   bagua(cx,coreY,r,-t*.12,.72);taiji(cx,coreY,58+48*p,t*.35,.98);
   particles(cx,coreY,210*p,22,t,.4,'#68eaff');
   hero(cx,heroY,.82,false);label('靈氣匯聚',H*.68,p);
 } else if(t<2.15){
   const p=ease((t-1.05)/1.10),r=235;
   bagua(cx,coreY,r,-t*.16,.78);taiji(cx,coreY,78,t*.38,1);
   for(let i=0;i<12;i++){let a=i*TAU/12+t*.24;sword(cx+Math.cos(a)*155,coreY+Math.sin(a)*95,75,a+Math.PI/2,.7,.9)}
   hero(cx,heroY,.82,false);label('劍陣初成',H*.68,p);
 } else if(t<3.45){
   const p=ease((t-2.15)/1.30),r=242;
   bagua(cx,coreY,r,t*.16,.80);taiji(cx,coreY,82,-t*.42,1);
   for(let i=0;i<20;i++){let a=i*TAU/20+t*.36;sword(cx+Math.cos(a)*190,coreY+Math.sin(a)*120,70,a+Math.PI/2,.64,.86)}
   sword(cx,coreY-5,Math.min(W,H)*.40,0,1.08,1,true);
   hero(cx,heroY,.82,false);label('劍來',H*.68,p);
 } else if(t<4.95){
   const p=ease((t-3.45)/1.50),r=250;
   bagua(cx,coreY,r,-t*.19,.80);taiji(cx,coreY,86,t*.5,1);
   for(let i=0;i<24;i++){let a=i*TAU/24+t*.48;let rr=205-85*p;sword(cx+Math.cos(a)*rr,coreY+Math.sin(a)*rr*.58,70,a+Math.PI/2,.61,.86)}
   hero(cx,heroY,.82,false);label('萬劍歸宗',H*.68,p);
 } else if(t<5.55){
   const p=ease((t-4.95)/.60);
   bagua(cx,coreY,270,t*.25,.82);taiji(cx,coreY,90,-t*.6,1);
   for(let i=0;i<16;i++){let a=i*TAU/16+t*.7;let rr=180-120*p;sword(cx+Math.cos(a)*rr,coreY+Math.sin(a)*rr*.58,72,a+Math.PI/2,.62,.82)}
   sword(cx,coreY-5,Math.min(W,H)*(.42+.08*p),0,1.16,1,true);
   hero(cx,heroY,.82,true);label('天命・破界',H*.68,p);
 } else if(t<6.05){
   const p=ease((t-5.55)/.50);
   slash(p);particles(cx,coreY,300,45,t,.72,'#ffe07a');
   ctx.globalAlpha=.34*(1-p);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
   label('破界！',H*.68,p);
 } else if(t<6.75){
   const p=1-(t-6.05)/.70;
   particles(cx,coreY,260,28,t,.5,'#69eaff');
   bagua(cx,coreY,270,(t-8.9)*.15,.25*p);taiji(cx,coreY,88,0,.25*p);
   hero(cx,heroY,.82,false);label('Boss重創',H*.68,p);
 } else {
   particles(cx,coreY,210,15,t,.3,'#9eefff');hero(cx,heroY,.82,false);label('一劍，破界。',H*.68,.8);
 }
 requestAnimationFrame(draw);
}
function play(){start=performance.now();requestAnimationFrame(draw)}
c.addEventListener('pointerdown',play,{passive:true});play();
})();
</script>
</body>
</html>
